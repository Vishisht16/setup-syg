name: major tag

# Workflows use vishisht16/setup-syg@v1. Publishing a release v1.x.y moves the
# tag v1 to it, so @v1 always means the newest v1 release.
on:
  release:
    types: [published]

permissions: {}

jobs:
  move:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the tag
    steps:
      # The checkout keeps its credentials, which the push below uses. Nothing
      # else runs in this job, and nothing is uploaded from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          ref: ${{ github.event.release.tag_name }}
      - name: move the major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "$TAG is not vMAJOR.MINOR.PATCH: no major tag moves"; exit 0; }
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
