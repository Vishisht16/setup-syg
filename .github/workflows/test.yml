name: test

# Runs the action as a user's workflow would, on each OS, and checks the syg it
# puts on PATH. Started by hand, with the version to install.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "the version to install, e.g. 1.0.0; empty for the latest release"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: syg
        uses: ./
        with:
          version: ${{ inputs.version }}
          telemetry: "false"
      - name: run it
        env:
          INSTALLED: ${{ steps.syg.outputs.version }}
          WANTED: ${{ inputs.version }}
        run: |
          syg version
          test -n "$INSTALLED"
          if [ -n "$WANTED" ]; then test "$INSTALLED" = "${WANTED#v}"; fi
          syg init new --service api
          syg check new
