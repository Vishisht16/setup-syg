name: test

# Runs the action as a user's workflow would, on each runner Syg has a build
# for, and checks the syg it puts on PATH. Started by hand, with the version
# to install.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "the version to install, e.g. 1.0.0; empty for the latest release"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: syg
        uses: ./
        with:
          version: ${{ inputs.version }}
          telemetry: "false"
      - name: run it
        env:
          INSTALLED: ${{ steps.syg.outputs.version }}
          WANTED: ${{ inputs.version }}
        run: |
          syg version
          test -n "$INSTALLED"
          if [ -n "$WANTED" ]; then test "$INSTALLED" = "${WANTED#v}"; fi
          syg init new --service api
          syg check new

  # What it refuses: a version that is not one, and one with no release.
  refuses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: malformed
        uses: ./
        continue-on-error: true
        with:
          version: "1.0"
      - id: missing
        uses: ./
        continue-on-error: true
        with:
          version: "0.0.1"
      - name: both refused
        env:
          MALFORMED: ${{ steps.malformed.outcome }}
          MISSING: ${{ steps.missing.outcome }}
        run: test "$MALFORMED" = failure && test "$MISSING" = failure && ! command -v syg
